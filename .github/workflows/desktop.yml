name: Build Citydriver desktop

# Manual artifact builds only. No release or updater destination is configured.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: electron:build:win
          - name: Linux
            os: ubuntu-latest
            script: electron:build:linux
          - name: macOS
            os: macos-latest
            script: electron:build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: citydriver-desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: error
